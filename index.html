

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Image Gallery</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 30px 15px;
      margin: 0;
    }

    h1 {
      margin-bottom: 10px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: 30px auto;
    }

    .item {
      background: #222;
      padding: 15px;
      border-radius: 12px;
    }

    img {
      width: 100%;
      height: 250px;
      object-fit: contain;
      border-radius: 8px;
      background: #181818;
    }

    a {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 18px;
      background: white;
      color: #111;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      background: #ccc;
    }
  </style>
</head>

<body>

  <h1>My Image Gallery</h1>
  <p>View and download my images.</p>

  <div class="gallery">

    <div class="item">
      <img src="image1.jfif" alt="Image 1">
      <a href="image1.jfif" download>Download Image 1</a>
    </div>

    <div class="item">
      <img src="image2.jfif" alt="Image 2">
      <a href="image2.jfif" download>Download Image 2</a>
    </div>

    <div class="item">
      <img src="image3.jfif" alt="Image 3">
      <a href="image3.jfif" download>Download Image 3</a>
    </div>

    <div class="item">
      <img src="image4.jfif" alt="Image 4">
      <a href="image4.jfif" download>Download Image 4</a>
    </div>

  </div>

</body>
</html>
