
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Image Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 30px;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }
    .item {
      background: #222;
      padding: 15px;
      border-radius: 12px;
      width: 300px;
    }
    img {
      width: 100%;
      border-radius: 8px;
    }
    a {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 18px;
      background: #fff;
      color: #111;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>My Image Gallery</h1>
  <p>View and download my images.</p>

  <div class="gallery">
    <div class="item">
      <img src="image1.png" alt="Image 1">
      <a href="image1.png" download>Download Image 1</a>
    </div>

    <div class="item">
      <img src="image2.jpg" alt="Image 2">
      <a href="image2.jpg" download>Download Image 2</a>
    </div>
  </div>
</body>
</html>
